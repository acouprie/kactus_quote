      date: "Date"
      name: "Nom"
    new_quote: "Ajouter un devis"
    edit: "Éditer"
    show: "Voir"
    destroy: "Supprimer"
    destroy_confirm: "Voulez-vous vraiment supprimer ce devis ?"
    back_to_list: "Retour à la liste"
    form:
      name_placeholder: "Nom du devis"
      submit: "Valider"
      cancel: "Annuler"
    quote_screen:
      draft_badge: "En cours d'édition"
      validated_badge: "Validé"
      save_and_exit: "Enregistrer et quitter"
      exit: "Quitter"
      table:
        article: "Article"
        quantity: "Qte"
        unit_price: "PU HT"
        vat_rate: "TVA"
