services:
  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  selenium:
    image: selenium/standalone-chromium:4.27.0
    shm_size: 2gb
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sSf http://localhost:4444/status | grep -qE '"ready"\s*:\s*true'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build: .
    command: rails server -b 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      selenium:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db_data: